name: Publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - 'fetch-validator-status/**'  # Build only if their are changes in thos directory

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build the Docker image
        run: docker build -t ghcr.io/${{ github.actor }}/REPOSITORY_NAME:${{ github.sha }} .

      - name: Push the Docker image
        run: docker push ghcr.io/${{ github.actor }}/REPOSITORY_NAME:${{ github.sha }}

